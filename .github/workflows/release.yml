name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout asdbctl source
        uses: actions/checkout@v4
        with:
          repository: juliuszint/asdbctl
          path: asdbctl-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build asdbctl
        working-directory: asdbctl-src
        run: cargo build --release

      - name: Install AHK v2 via winget
        shell: pwsh
        run: |
          winget install --id AutoHotkey.AutoHotkey --exact `
            --accept-package-agreements --accept-source-agreements `
            --silent --disable-interactivity --source winget
          # exit code -1978335189 = "already installed", treat as success
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) {
            throw "winget install failed: exit $LASTEXITCODE"
          }
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\AutoHotkey\v2",
            "$env:ProgramFiles\AutoHotkey\v2",
            "${env:ProgramFiles(x86)}\AutoHotkey\v2"
          )
          $ahkDir = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c 'AutoHotkey64.exe')) { $ahkDir = $c; break }
          }
          if (-not $ahkDir) { throw "AHK v2 install path not found in any candidate" }
          "AHK_DIR=$ahkDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "AHK v2 at: $ahkDir"

      - name: Compile brightness.ahk to brightness.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $base = Join-Path $env:AHK_DIR 'AutoHotkey64.exe'
          $compiler = Join-Path $env:AHK_DIR 'Compiler\Ahk2Exe.exe'
          if (-not (Test-Path $compiler)) { throw "Ahk2Exe.exe not found at $compiler" }
          $src = (Resolve-Path './brightness.ahk').Path
          $out = Join-Path ((Resolve-Path './dist').Path) 'brightness.exe'
          & $compiler /in $src /out $out /base $base
          if (-not (Test-Path $out)) { throw "Ahk2Exe did not produce $out" }

      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item asdbctl-src/target/release/asdbctl.exe dist/
          Copy-Item brightness.ahk dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/

      - name: Create zip
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          Compress-Archive -Path dist/* -DestinationPath "asd-tray-windows-$tag.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: asd-tray-windows-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
