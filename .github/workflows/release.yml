name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout asdbctl source
        uses: actions/checkout@v4
        with:
          repository: juliuszint/asdbctl
          path: asdbctl-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build asdbctl
        working-directory: asdbctl-src
        run: cargo build --release

      - name: Install AHK v2 via winget
        shell: pwsh
        run: |
          winget install --id AutoHotkey.AutoHotkey --exact `
            --accept-package-agreements --accept-source-agreements `
            --silent --disable-interactivity --source winget
          # exit code -1978335189 = "already installed", treat as success
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) {
            throw "winget install failed: exit $LASTEXITCODE"
          }
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\AutoHotkey\v2",
            "$env:ProgramFiles\AutoHotkey\v2",
            "${env:ProgramFiles(x86)}\AutoHotkey\v2"
          )
          $ahkDir = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c 'AutoHotkey64.exe')) { $ahkDir = $c; break }
          }
          if (-not $ahkDir) { throw "AHK v2 install path not found in any candidate" }
          "AHK_DIR=$ahkDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "AHK v2 at: $ahkDir"

      - name: Download Ahk2Exe (winget AHK install does not include the compiler)
        shell: pwsh
        run: |
          $url = 'https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip'
          Invoke-WebRequest -Uri $url -OutFile ahk2exe.zip -UseBasicParsing
          Expand-Archive -Path ahk2exe.zip -DestinationPath ahk2exe -Force
          $exe = Get-ChildItem -Path ahk2exe -Filter 'Ahk2Exe.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Ahk2Exe.exe not found in zip" }
          "AHK2EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Ahk2Exe: $($exe.FullName)"

      - name: Compile brightness.ahk to brightness.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $base = Join-Path $env:AHK_DIR 'AutoHotkey64.exe'
          if (-not (Test-Path $base)) { throw "AutoHotkey64.exe missing at $base" }
          $src = (Resolve-Path './brightness.ahk').Path
          $out = Join-Path ((Resolve-Path './dist').Path) 'brightness.exe'
          & $env:AHK2EXE /in $src /out $out /base $base
          # Ahk2Exe prints "Successfully compiled" before the file metadata is
          # visible to other handles, so poll briefly.
          for ($i = 0; $i -lt 25; $i++) {
            if (Test-Path $out) { break }
            Start-Sleep -Milliseconds 200
          }
          if (-not (Test-Path $out)) { throw "Ahk2Exe did not produce $out" }
          Write-Host "Compiled: $out ($([math]::Round((Get-Item $out).Length/1KB)) KB)"

      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item asdbctl-src/target/release/asdbctl.exe dist/
          Copy-Item brightness.ahk dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/

      - name: Create zip
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          Compress-Archive -Path dist/* -DestinationPath "asd-tray-windows-$tag.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: asd-tray-windows-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
